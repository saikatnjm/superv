# Builds the .deb, .rpm and Arch packages and attaches them to the GitHub release.
# Trigger: push a tag like v1.1.3   (git tag v1.1.3 && git push origin v1.1.3)
name: Release packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    name: .deb (Ubuntu 22.04+, Mint 21+, Debian 12+)
    runs-on: ubuntu-22.04          # oldest supported glibc, so the package runs on newer releases too
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev
      - run: make && strip superv && cp superv bin/superv-x86_64
      - run: packaging/build-deb.sh
      - uses: actions/upload-artifact@v4
        with: { name: deb, path: dist/*.deb }

  rpm:
    name: .rpm (Fedora, openSUSE Tumbleweed)
    runs-on: ubuntu-latest
    container: fedora:40
    steps:
      - run: dnf install -y git tar rpm-build gcc make pkgconf-pkg-config gtk3-devel libX11-devel systemd-rpm-macros
      - uses: actions/checkout@v4
      - name: Build
        run: |
          V="$(sed -n 's/^#define VERSION "\(.*\)"/\1/p' superv.c)"
          sed -i "s/^Version:.*/Version:        $V/" packaging/rpm/superv.spec
          mkdir -p dist
          tar --exclude=./dist --exclude=./.git --transform "s,^\.,superv-$V," -czf "dist/superv-$V.tar.gz" .
          rpmbuild -bb packaging/rpm/superv.spec --define "_sourcedir $PWD/dist" --define "_rpmdir $PWD/dist"
          cp dist/x86_64/superv-*.rpm dist/
          cp dist/x86_64/superv-*.rpm dist/superv.x86_64.rpm
      - uses: actions/upload-artifact@v4
        with: { name: rpm, path: dist/*.rpm }

  arch:
    name: Arch package (Arch, Manjaro, EndeavourOS)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel git gtk3 libx11 libxtst python python-gobject
      - uses: actions/checkout@v4
      - name: Build
        run: |
          V="$(sed -n 's/^#define VERSION "\(.*\)"/\1/p' superv.c)"
          useradd -m builder
          mkdir -p /tmp/build && cp packaging/arch/PKGBUILD packaging/arch/superv.install /tmp/build/
          sed -i "s/^pkgver=.*/pkgver=$V/" /tmp/build/PKGBUILD
          # build from this checkout instead of downloading the tag
          tar --exclude=./.git --transform "s,^\.,superv-$V," -czf "/tmp/build/superv-$V.tar.gz" .
          sed -i "s|^source=.*|source=(\"superv-$V.tar.gz\")|" /tmp/build/PKGBUILD
          chown -R builder /tmp/build
          su builder -c "cd /tmp/build && makepkg --nodeps --noconfirm"
          mkdir -p dist && cp /tmp/build/*.pkg.tar.zst dist/
          cp /tmp/build/*.pkg.tar.zst dist/superv-x86_64.pkg.tar.zst
      - uses: actions/upload-artifact@v4
        with: { name: arch, path: dist/*.pkg.tar.zst }

  release:
    name: Attach to the release
    needs: [deb, rpm, arch]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          fail_on_unmatched_files: true
