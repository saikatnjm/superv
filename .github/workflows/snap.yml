# Builds the snap (snap/snapcraft.yaml), installs it on a clean Ubuntu runner, runs the Snap Store's own review
# checks on it, and keeps the .snap as a download. Nothing is uploaded to the Snap Store from here.
name: Snap

on:
  workflow_dispatch:
  push:
    branches: [snap]
    paths: ["snap/**", ".github/workflows/snap.yml"]

permissions:
  contents: read

jobs:
  snap:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: snapcore/action-build@v1
        id: build

      # GitHub shows job logs only to signed-in users; annotations are public, so put snapcraft's errors there
      - name: Show why the build failed
        if: failure() && steps.build.outcome == 'failure'
        run: |
          log=$(sudo sh -c 'ls -t /root/.local/state/snapcraft/log/*.log /home/*/.local/state/snapcraft/log/*.log 2>/dev/null | head -1')
          [ -n "$log" ] || { echo "::error title=snapcraft::no snapcraft log found"; exit 0; }
          enc() { sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | cut -c1-3800; }
          echo "::error title=snapcraft errors::$(sudo grep -i -E 'error|fail|invalid|cannot|not found|unknown|denied' "$log" | tail -n 30 | enc)"
          echo "::error title=snapcraft log end::$(sudo tail -n 30 "$log" | enc)"

      - name: Snap Store review checks
        run: |
          sudo snap install review-tools
          out=$(review-tools.snap-review --allow-classic "${{ steps.build.outputs.snap }}" 2>&1) && ok=1 || ok=0
          echo "$out"
          echo "::notice title=Snap Store review::$(echo "$out" | tail -n 15 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | cut -c1-3000)"
          [ "$ok" = 1 ]

      - name: Install it and check it runs
        run: |
          set -x
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb dbus-x11 libgtk-3-0 python3-gi gir1.2-glib-2.0
          sudo snap install --dangerous --classic "${{ steps.build.outputs.snap }}"
          snap list superv
          /snap/bin/superv --version
          ls /snap/superv/current/usr/bin /snap/superv/current/bin
          # the snap's setup helper uses the update-proof path; the repo's own file is untouched
          grep -q snap_exe /snap/superv/current/usr/bin/superv-setup
          ! grep -q snap_exe superv-setup
          # start it like a first launch from the menu: it should stay running and add itself to startup apps
          xvfb-run -a dbus-run-session -- bash -ec '
            /snap/bin/superv --daemon & sleep 4
            running=$(pgrep -a -f "usr/bin/superv --daemon")
            startup=$(grep "^Exec=" ~/.config/autostart/superv.desktop)
            /snap/superv/current/usr/bin/superv --quit; sleep 1
            ! pgrep -f "usr/bin/superv --daemon"
            echo "::notice title=snap test::$(/snap/bin/superv --version) ran and quit cleanly. Running: $running. Startup entry: $startup"'
          echo "::notice title=snap size::$(du -k "${{ steps.build.outputs.snap }}" | cut -f1) KB"

      - uses: actions/upload-artifact@v4
        with:
          name: superv-snap
          path: ${{ steps.build.outputs.snap }}
